# PulseDeck example configuration.
# deploy_hub.sh writes the detected LAN IPv4 into the runtime copy.
# Never place API keys, passwords or tokens in this versioned example.

[mqtt]
host = "192.168.0.250" # example only; rendered from the target host at deployment
port = 1883
namespace = "pulsedeck/v1"
client_id = "pulsedeck-hub"
keepalive = 30
reconnect_min_delay = 1
reconnect_max_delay = 30

[admin]
enabled = true
listen = "192.168.0.250" # example only; rendered from the target host at deployment
port = 8080

[collectors.weather]
enabled = false
provider = "openweather-onecall-4"
# latitude = 49.0
# longitude = 6.0
location_name = ""
api_key_file = "/etc/pulsedeck/secrets/openweather_api_key"
lang = "fr"
current_interval = 600
hourly_interval = 1800
daily_interval = 10800
hourly_hours = 48
daily_days = 10
request_timeout = 15

[collectors.news]
enabled = false
provider = "newsapi"
mode = "top-headlines"
query = ""
sources = ""
country = "fr"
category = ""
search_in = ""
domains = ""
exclude_domains = ""
from = ""
to = ""
lang = "fr"
sort_by = "publishedAt"
nullable = ""
max_articles = 10
interval = 1800
request_timeout = 15
api_key_file = "/etc/pulsedeck/secrets/newsapi_api_key"
# For provider = "gnews", PulseDeck Admin switches this to:
# /etc/pulsedeck/secrets/gnews_api_key

[collectors.pc_gamer]
enabled = false

[collectors.mini_server]
# First machine selected for PulseDeck Agent monitoring.
# Keep disabled until the Agent -> Pi transport contract is implemented.
enabled = false
host = "192.168.0.1"

[collectors.printer]
enabled = false
poll_interval = 5
request_timeout = 8
thumbnail_max_base64_bytes = 2000000
thumbnail_max_png_bytes = 1500000
thumbnail_max_pixels = 1000000

# One table per printer. Put the printer in LAN mode first; PulseDeck only needs host + access code.
# The serial number is discovered automatically from the printer and is not configured here.
# Secrets remain outside the versioned config.
