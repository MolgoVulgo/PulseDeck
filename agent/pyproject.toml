[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsedeck-agent"
version = "0.1.0"
description = "Machine-local metrics agent for PulseDeck"
requires-python = ">=3.11"
dependencies = [
  "psutil>=5.9,<8",
  "PyYAML>=6,<7",
]

[project.scripts]
pulsedeck-agent = "pulsedeck_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
