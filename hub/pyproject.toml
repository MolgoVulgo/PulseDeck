[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsedeck-hub"
version = "0.3.1"
description = "PulseDeck Raspberry Pi data hub"
requires-python = ">=3.14"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
]

[project.scripts]
pulsedeck-hub = "pulsedeck_hub.main:main"

[tool.setuptools.packages.find]
where = ["src"]
